[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "spectacles_reachy_mini"
version = "0.9"
description = "Spectacles AR controller — WebSocket bridge for Snap Spectacles AR glasses to Reachy Mini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "openai",
]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
spectacles_reachy_mini = "spectacles_reachy_mini.main:SpectaclesReachyMini"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
spectacles_reachy_mini = ["**/*"] # Also include all non-.py files