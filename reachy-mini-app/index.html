<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>SPECS AR Controller</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@500&display=swap"

	>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<main class="card">
		<h1 class="title">SPECS AR Controller</h1>
		<p class="hint">WebSocket bridge to control Reachy Mini from Snap SPECS.</p>
		<ul class="api-list" aria-label="WebSocket message types">
			<li><code>set_target</code></li>
			<li><code>goto</code></li>
			<li><code>stop_move</code></li>
			<li><code>play_audio</code></li>

			<li><code>get_robot_camera_frame</code></li>
		</ul>
	</main>
